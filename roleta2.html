<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta do Mike</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/XOEcuO8.png">
<style>
:root {
  --cor-dourado: #d1a720;
  --cor-fundo: #1a1a1a;
  --cor-card: rgba(40, 35, 25, 0.95);
  --cor-texto: #f5f5f5;
}
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, rgba(20,20,20,0.9), rgba(40,30,20,0.9)),
              url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
  background-size: cover;
  color: var(--cor-texto);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
header {
  position: fixed; top:0; left:0; right:0;
  padding:12px 20px;
  display:flex; align-items:center; gap:12px;
  background: rgba(20,20,20,0.9);
  border-bottom: 2px solid var(--cor-dourado);
  box-shadow:0 2px 8px rgba(0,0,0,0.6);
  z-index:1000;
}
header img{height:42px;}
header h1{font-size:1.6rem;color:var(--cor-dourado);}
main{
  margin-top:100px;
  display:flex;
  gap:80px; /* aumenta o espaço entre a roleta e a lista */
  justify-content:center; /* centraliza o conjunto */
  align-items:flex-start;
  width:100%;
  max-width:1400px;
  padding:20px 60px;
}
.roleta-container{
  position:relative;
  width:620px;
  height:620px;
}
canvas{
  width:600px;
  height:600px;
  border-radius:50%;
  box-shadow:0 0 20px rgba(0,0,0,0.7);
  background:#222;
  display:block;
}
.ponteiro {
  position: absolute;
  top: calc(50% - 10px);                          /* centraliza verticalmente */
  left: calc(100% + 5px);                         /* centraliza horizontalmente */
  transform: translate(-50%, -52%) rotate(180deg); 
  width: 140px;
  height: auto;
  z-index: 20;
  pointer-events: none;
  filter: drop-shadow(0 0 8px rgba(0,0,0,0.7));
}

.botao{
  margin-top:20px; padding:12px 24px;
  font-size:1rem; font-weight:bold;
  border:none; border-radius:10px; cursor:pointer;
  background:var(--cor-dourado); color:#111;
  transition: transform .2s;
}
.botao:hover{transform:scale(1.05);}
.lista{
  width:360px;
  flex-shrink:0;
  background:var(--cor-card);
  padding:20px; border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,0.6);
}
.lista h2{
  margin-bottom:12px; font-size:1.3rem;
  color:var(--cor-dourado); text-align:center;
}
.lista table{width:100%; border-collapse:collapse; table-layout:fixed;}
.lista th,.lista td{
  padding:8px; text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.2);
  vertical-align:middle;
}
.lista table th:nth-child(1),.lista td:nth-child(1){ width:62%; text-align:left; padding-left:8px;}
.lista table th:nth-child(2),.lista td:nth-child(2){ width:28%; }
.lista table th:nth-child(3),.lista td:nth-child(3){ width:10%; }
.lista input{
  width:95%; padding:6px 8px;
  border-radius:6px; border:none;
  background: rgba(255,255,255,0.04);
  color: var(--cor-texto);
}
.lista td:nth-child(2) input{width:90px; text-align:center;}
.remover{
  cursor:pointer; color:red; font-weight:bold;
  border:none; background:transparent; font-size:1.1rem;
}
.add-btn,.bulk-btn,.save-btn{
  margin-top:10px; width:100%;
  font-weight:bold; border:none;
  padding:10px; border-radius:8px;
  cursor:pointer;
}
.add-btn{background:#28a745; color:white;}
.add-btn:hover{background:#218838;}
.bulk-btn{background:#007bff;color:white;}
.bulk-btn:hover{background:#0069d9;}
.save-btn{background:#6f42c1;color:white;}
.save-btn:hover{background:#5a33a8;}
#bulk-area{display:none;margin-top:10px;width:100%;}
#bulk-text{
  width:100%; height:120px;
  border-radius:8px; padding:10px;
  border:none; resize:vertical;
}
#bulk-confirm{
  margin-top:5px; width:100%;
  background:#17a2b8; color:white;
  font-weight:bold; border:none;
  padding:8px; border-radius:6px; cursor:pointer;
}
#bulk-confirm:hover{background:#138496;}
@media(max-width:1100px){
  .roleta-container{transform:scale(0.85); transform-origin:left top; width:525px;height:525px;}
  canvas{width:500px;height:500px;}
}
</style>
</head>
<body>
<header>
  <img src="https://i.imgur.com/XOEcuO8.png" alt="Mascote">
  <h1>Roleta do Mike</h1>
</header>

<main>
  <div class="roleta-container" style="position: relative; display: inline-block;">
    <img src="img/ponteiro.png" alt="Ponteiro" class="ponteiro">
    <canvas id="roleta" width="600" height="600"></canvas>
    <button class="botao" onclick="girar()">Girar</button>
  </div>

  <div class="lista">
    <h2>Itens da Roleta</h2>
    <table id="tabela">
      <thead><tr><th>Item</th><th>%</th><th></th></tr></thead>
      <tbody>
        <tr><td><input value="Item 1"></td><td><input type="number" value="50" step="0.01"></td><td><button class="remover" onclick="removerLinha(this)">❌</button></td></tr>
        <tr><td><input value="Item 2"></td><td><input type="number" value="50" step="0.01"></td><td><button class="remover" onclick="removerLinha(this)">❌</button></td></tr>
      </tbody>
    </table>
    <button class="add-btn" onclick="adicionarLinha()">+ Adicionar Recompensa</button>
    <button class="bulk-btn" onclick="abrirBulk()">📥 Bulk Add</button>
    <button class="save-btn" onclick="salvarLista()">💾 Salvar Lista</button>

    <div id="bulk-area">
      <textarea id="bulk-text" placeholder="Digite um item por linha... (ex: Item 1; 60,01)"></textarea>
      <button id="bulk-confirm" onclick="confirmarBulk()">Adicionar em Massa</button>
    </div>
  </div>
</main>

<script>
const canvas = document.getElementById("roleta");
const ctx = canvas.getContext("2d");
let anguloAtual = 0;

function getAllRows() {
  return Array.from(document.querySelectorAll("#tabela tbody tr"));
}

function getItens() {
  return getAllRows()
    .map(row => {
      const nome = row.cells[0].querySelector("input").value.trim();
      const perc = parseFloat(row.cells[1].querySelector("input").value) || 0;
      return { row, nome, perc, percInput: row.cells[1].querySelector("input") };
    })
    .filter(r => r.nome !== "");
}

function normalizarPercentuais() {
  const rows = getAllRows();
  const itens = rows.map(row => {
    const nome = row.cells[0].querySelector("input").value.trim();
    const percInput = row.cells[1].querySelector("input");
    const perc = parseFloat(percInput.value) || 0;
    return { row, nome, perc, percInput };
  }).filter(r => r.nome !== "");

  const total = itens.reduce((s, it) => s + it.perc, 0);

  if (itens.length === 0) {
    return;
  }

  if (total === 0) {
    const equal = 100 / itens.length;
    itens.forEach(it => {
      it.percInput.value = equal.toFixed(2);
    });
    return;
  }
  itens.forEach(it => {
    const normalized = (it.perc / total) * 100;
    it.percInput.value = normalized.toFixed(2);
  });
}

function desenharRoleta() {
  normalizarPercentuais();
  const itens = getItens();
  const total = itens.reduce((s, it) => s + it.perc, 0) || 100;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(anguloAtual);
  let angIni = 0;

  const cores = ["#FFC067", "#FFEE8C"]; 

  itens.forEach((item, i) => {
    const ang = (item.perc / total) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, canvas.width / 2, angIni, angIni + ang);
    ctx.closePath();
    ctx.fillStyle = cores[i % 2]; 
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.stroke();

    ctx.save();
    ctx.rotate(angIni + ang / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#333";
    ctx.font = Math.max(12, Math.round(canvas.width / 30)) + "px Arial";
    ctx.fillText(item.nome, canvas.width / 2 - 16, 10);
    ctx.restore();

    angIni += ang;
  });
  ctx.restore();
}


function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function girar() {
  const duracao = 10000;
  const voltas = 5 + Math.random() * 5;
  const angDestino = anguloAtual + voltas * 2 * Math.PI;
  const inicio = performance.now();
  const inicioAng = anguloAtual;

  function animar(ts) {
    const progresso = (ts - inicio) / duracao;
    if (progresso < 1) {
      anguloAtual = inicioAng + (angDestino - inicioAng) * easeOutCubic(progresso);
      desenharRoleta();
      requestAnimationFrame(animar);
    } else {
      anguloAtual = angDestino % (2 * Math.PI);
      desenharRoleta();
      mostrarResultado();
    }
  }
  requestAnimationFrame(animar);
}

function mostrarResultado() {
  const itens = getItens();
  if (itens.length === 0) return;

  // Calcula o ângulo atual e inverte pois a roleta gira, não o ponteiro
  const angFinal = (2 * Math.PI - (anguloAtual % (2 * Math.PI))) % (2 * Math.PI);

  // Calcula o ângulo limite de cada setor
  let angAcumulado = 0;
  const total = itens.reduce((s, it) => s + it.perc, 0);

  for (let item of itens) {
    const angItem = (item.perc / total) * 2 * Math.PI;
    if (angFinal >= angAcumulado && angFinal < angAcumulado + angItem) {
      alert(`🎉 Resultado: ${item.nome}`); //tirar o pop-up
      return;
    }
    angAcumulado += angItem;
  }

  // Caso raro (ângulo = 2π)
  alert(`🎉 Resultado: ${itens[itens.length - 1].nome}`);
}

function removerLinha(btn) {
  btn.closest("tr").remove();
  normalizarPercentuais();
  desenharRoleta();
}

function adicionarLinha(nome = "Novo Item") {
  const tbody = document.querySelector("#tabela tbody");
  const nova = document.createElement("tr");
  nova.innerHTML = `<td><input value="${nome}"></td>
  <td><input type="number" value="0" step="0.01"></td>
  <td><button class="remover" onclick="removerLinha(this)">❌</button></td>`;
  tbody.appendChild(nova);
  nova.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    desenharRoleta();
  }));
  normalizarPercentuais();
  desenharRoleta();
}

function abrirBulk() {
  const area = document.getElementById("bulk-area");
  area.style.display = area.style.display === "none" ? "block" : "none";
}

function confirmarBulk() {
  const texto = document.getElementById("bulk-text").value.trim();
  if (!texto) return;
  const linhas = texto.split("\n").map(l => l.trim()).filter(l => l);
  const tbody = document.querySelector("#tabela tbody");
  linhas.forEach(item => {
    let nome = item, perc = 0;
    if (item.includes(";")) {
      const partes = item.split(";");
      nome = partes[0].trim();
      perc = parseFloat(partes[1].replace(",", ".").trim()) || 0;
    }
    const nova = document.createElement("tr");
    nova.innerHTML = `<td><input value="${nome}"></td>
    <td><input type="number" value="${perc.toFixed(2)}" step="0.01"></td>
    <td><button class="remover" onclick="removerLinha(this)">❌</button></td>`;
    tbody.appendChild(nova);
    nova.querySelectorAll('input').forEach(inp => inp.addEventListener('input', desenharRoleta));
  });
  document.getElementById("bulk-text").value = "";
  document.getElementById("bulk-area").style.display = "none";
  normalizarPercentuais();
  desenharRoleta();
}

function salvarLista() {
  const itens = getItens();
  const texto = itens.map(it => `${it.nome}; ${it.perc.toFixed(2)}`).join("\n");
  const blob = new Blob([texto], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "itens_roleta.txt";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
document.querySelectorAll("#tabela tbody input").forEach(inp => inp.addEventListener('input', desenharRoleta));
normalizarPercentuais();
desenharRoleta();
</script>
</body>
</html>
