<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz Interativo - Humble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="img/mike_anotando2.png">
  
  <style>
    /* --- VARIÁVEIS GLOBAIS (BASE HUMBLE) --- */
    :root {
      --cor-dourado: #d1a720; 
      --cor-fundo: #1a1a1a; 
      --cor-texto: #f5f5f5;
      --cor-overlay: rgba(20, 20, 20, 0.9);
      --cor-sucesso: #2ecc71;
      --cor-erro: #e74c3c;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      /* Fundo original do site */
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--cor-texto);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Cabeçalho Simplificado ---------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: center; /* Centraliza o logo já que não tem menu */
      align-items: center;
      background: var(--cor-overlay);
      border-bottom: 2px solid var(--cor-dourado);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      z-index: 1000;
      box-sizing: border-box;
    }

    header h1 {
      font-size: 1.6rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--cor-dourado);
    }

    header h1 a {
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 img {
      height: 40px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    header h1 img:hover {
        transform: scale(1.1);
    }

    /* =========================================
       ESTILOS DO QUIZ
       ========================================= */
    
    .main-content {
        margin-top: 100px; /* Espaço para o header fixo */
        width: 100%;
        max-width: 700px;
        padding: 20px;
        box-sizing: border-box;
    }

    .quiz-box {
        background: rgba(30, 30, 30, 0.9);
        border: 2px solid var(--cor-dourado);
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 0 20px rgba(209, 167, 32, 0.2);
        text-align: center;
    }

    h2 { color: var(--cor-dourado); margin-bottom: 20px; }
    
    .hidden { display: none !important; }

    /* Inputs estilizados */
    input[type="text"] {
        width: 80%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid var(--cor-dourado);
        background: #222;
        color: white;
        font-size: 1rem;
        outline: none;
    }

    input[type="text"]:focus {
        box-shadow: 0 0 8px var(--cor-dourado);
    }

    /* Botões estilizados */
    button {
        background: var(--cor-dourado);
        color: #1a1a1a;
        font-weight: bold;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    button:hover {
        background: #e5bd35;
        transform: scale(1.05);
        box-shadow: 0 0 10px rgba(209, 167, 32, 0.5);
    }

    /* Botões de Opção (Quiz) */
    .option-btn {
        display: block;
        width: 100%;
        margin: 10px 0;
        background: transparent;
        border: 1px solid var(--cor-dourado);
        color: var(--cor-dourado);
    }

    .option-btn:hover {
        background: var(--cor-dourado);
        color: #1a1a1a;
    }

    /* HUD (Timer e Score) */
    .hud {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        padding: 10px;
        background: rgba(0,0,0,0.5);
        border-radius: 8px;
        border: 1px solid #444;
    }

    /* Leaderboard */
    .leaderboard-container {
        margin-top: 30px;
        text-align: left;
        background: rgba(0,0,0,0.6);
        padding: 15px;
        border-radius: 10px;
    }

    .leaderboard-container h3 {
        text-align: center;
        color: var(--cor-dourado);
        margin-top: 0;
    }

    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #444; display: flex; justify-content: space-between;}
    
    li:nth-child(1) { color: #ffd700; font-weight: bold; text-shadow: 0 0 5px #ffd700; } /* Ouro */
    li:nth-child(2) { color: #c0c0c0; } /* Prata */
    li:nth-child(3) { color: #cd7f32; } /* Bronze */

    @media (max-width: 500px) {
      header h1 { font-size: 1.3rem; }
      .quiz-box { padding: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <a href="index.html">
        <img src="https://i.imgur.com/XOEcuO8.png" alt="Mascote">
        Humble Quiz
      </a>
    </h1>
  </header>

  <div class="main-content">
    <div class="quiz-box">
        
        <div id="login-screen">
            <h2>🏆 Humble Quiz</h2>
            <p>Insira seu nick para competir no ranking:</p>
            <input type="text" id="username" placeholder="Seu Nick aqui..." maxlength="15" />
            <br>
            <button onclick="startGame()">Começar Desafio</button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="hud">
                <span id="timer">⏳ Tempo: 0s</span>
                <span id="score-display">💎 Pontos: 0</span>
            </div>
            
            <div id="question-container">
                <h2 id="question-text">Carregando...</h2>
                
                <div id="options-container"></div>
                
                <input type="text" id="text-answer" class="hidden" placeholder="Digite a resposta...">
                <button id="btn-submit-text" class="hidden" onclick="checkAnswerText()">Enviar</button>
            </div>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Fim de Jogo!</h2>
            <p>Sua pontuação final:</p>
            <h1 id="final-score" style="color: var(--cor-dourado); font-size: 3rem; margin: 10px 0;">0</h1>
            <button onclick="location.reload()">Jogar Novamente</button>
        </div>

        <div class="leaderboard-container">
            <h3>📊 Top 3 Jogadores</h3>
            <ul id="leaderboard-list">
                <li style="justify-content: center;">Carregando ranking...</li>
            </ul>
        </div>

    </div>
  </div>

  <script>
    // --- LÓGICA DO QUIZ ---
    
    // Mude isso quando subir o Python no Render
    const API_URL = "http://localhost:8000"; 
    
    let questions = [];
    let currentQuestionIndex = 0;
    let username = "";
    let timerInterval;
    let timeLeft = 0;

    async function loadQuestions() {
        try {
            const response = await fetch('perguntas/quiz_data.json');
            if (!response.ok) throw new Error("Arquivo não encontrado");
            questions = await response.json();
        } catch (error) {
            alert("Erro: Não foi possível carregar 'perguntas/quiz_data.json'.");
            console.error(error);
        }
    }

    async function startGame() {
        username = document.getElementById('username').value.trim();
        if (!username) return alert("Por favor, digite um nick válido!");

        try {
            await fetch(`${API_URL}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            });
        } catch (e) {
            console.warn("Backend offline. Jogando em modo local.");
        }

        await loadQuestions();
        if (questions.length === 0) return;

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        showQuestion();
        updateLeaderboard();
        setInterval(updateLeaderboard, 5000); 
    }

    function showQuestion() {
        if (currentQuestionIndex >= questions.length) {
            endGame();
            return;
        }

        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.text;
        
        const optionsContainer = document.getElementById('options-container');
        const textInput = document.getElementById('text-answer');
        const btnSubmit = document.getElementById('btn-submit-text');

        optionsContainer.innerHTML = "";
        textInput.value = "";
        
        clearInterval(timerInterval);
        timeLeft = q.time_limit;
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) submitAnswer(false);
        }, 1000);

        if (q.type === 'multiple_choice') {
            textInput.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        } else {
            textInput.classList.remove('hidden');
            btnSubmit.classList.remove('hidden');
            textInput.focus();
        }
    }

    function updateTimerDisplay() {
        const t = document.getElementById('timer');
        t.innerText = `⏳ Tempo: ${timeLeft}s`;
        t.style.color = timeLeft < 5 ? "#e74c3c" : "var(--cor-texto)";
    }

    function checkAnswerText() {
        const val = document.getElementById('text-answer').value;
        checkAnswer(val);
    }

    async function checkAnswer(answer) {
        clearInterval(timerInterval);
        const q = questions[currentQuestionIndex];
        const isCorrect = answer.toString().toLowerCase() === q.correct.toString().toLowerCase();

        try {
            const res = await fetch(`${API_URL}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    question_id: q.id,
                    is_correct: isCorrect,
                    time_left: timeLeft,
                    total_time: q.time_limit
                })
            });
            
            if(res.ok) {
                const data = await res.json();
                document.getElementById('score-display').innerText = `💎 Pontos: ${data.current_score}`;
            }
        } catch (e) {
            console.log("Erro de conexão ao enviar resposta.");
        }

        currentQuestionIndex++;
        showQuestion();
        updateLeaderboard();
    }

    async function updateLeaderboard() {
        try {
            const res = await fetch(`${API_URL}/leaderboard`);
            if(!res.ok) throw new Error("API erro");
            
            const data = await res.json();
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = "";

            if(data.length === 0) {
                list.innerHTML = "<li style='justify-content:center'>Sem registros...</li>";
                return;
            }

            data.forEach((p, index) => {
                const li = document.createElement('li');
                let medal = "";
                if(index === 0) medal = "🥇";
                if(index === 1) medal = "🥈";
                if(index === 2) medal = "🥉";

                li.innerHTML = `<span>${medal} #${index+1} ${p.username}</span> <span>${p.score} pts</span>`;
                list.appendChild(li);
            });
        } catch (e) {
            // Silencioso
        }
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        const finalScore = document.getElementById('score-display').innerText.replace('💎 Pontos: ', '');
        document.getElementById('final-score').innerText = finalScore;
    }
  </script>
</body>
</html>
