<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz Interativo - Humble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/mike_anotando2.png">
  
  <style>
    /* --- ESTILOS VISUAIS (TEMA HUMBLE) --- */
    :root {
      --cor-dourado: #d1a720; 
      --cor-fundo: #1a1a1a; 
      --cor-texto: #f5f5f5;
      --cor-overlay: rgba(20, 20, 20, 0.95);
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0; padding: 0; min-height: 100vh;
      color: var(--cor-texto);
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; padding: 15px; background: var(--cor-overlay);
      border-bottom: 2px solid var(--cor-dourado); text-align: center;
      position: fixed; top: 0; z-index: 100;
    }
    header h1 a { color: var(--cor-dourado); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; }
    header img { height: 40px; }

    .main-content { margin-top: 100px; width: 95%; max-width: 600px; }
    .quiz-box {
        background: rgba(30, 30, 30, 0.95); border: 2px solid var(--cor-dourado);
        border-radius: 15px; padding: 25px; text-align: center;
        box-shadow: 0 0 15px rgba(209, 167, 32, 0.3);
    }

    .hidden { display: none !important; }

    input { padding: 12px; width: 70%; border-radius: 5px; border: 1px solid var(--cor-dourado); background: #222; color: white; margin-bottom: 10px; text-align: center; font-size: 1.1em;}
    button { padding: 12px 25px; background: var(--cor-dourado); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; margin-top: 10px; font-size: 1rem; }
    button:hover { background: #e5bd35; transform: scale(1.05); }
    
    .option-btn { width: 100%; background: transparent; border: 1px solid var(--cor-dourado); color: var(--cor-dourado); margin: 8px 0; }
    .option-btn:hover { background: var(--cor-dourado); color: black; }

    .hud { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; }
    
    /* Leaderboard */
    .leaderboard-box {
        margin-top: 30px; text-align: left; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px;
    }
    .leaderboard-box h3 { text-align: center; color: var(--cor-dourado); margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #444; display: flex; justify-content: space-between;}
    li:nth-child(1) { color: #ffd700; font-weight: bold; } 
    li:nth-child(2) { color: #c0c0c0; } 
    li:nth-child(3) { color: #cd7f32; }
  </style>
</head>
<body>

  <header>
    <h1>
      <a href="index.html">
        <img src="https://i.imgur.com/XOEcuO8.png" alt="Icone"> Humble Quiz
      </a>
    </h1>
  </header>

  <div class="main-content">
    <div class="quiz-box">
        
        <div id="login-screen">
            <h2>🏆 Humble Quiz</h2>
            <p>Digite seu nick para entrar no Ranking:</p>
            <input type="text" id="username" placeholder="Seu Nick..." maxlength="15" />
            <br>
            <button id="btn-start">COMEÇAR</button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="hud">
                <span id="timer">⏳ 0s</span>
                <span id="score-display">💎 0</span>
            </div>
            
            <h2 id="question-text">Carregando...</h2>
            <div id="options-container"></div>
            <input type="text" id="text-answer" class="hidden" placeholder="Sua resposta...">
            <button id="btn-submit-text" class="hidden">Confirmar</button>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Fim de Jogo!</h2>
            <p>Sua pontuação foi salva no ranking.</p>
            <h1 id="final-score" style="color: var(--cor-dourado); font-size: 4rem; margin: 10px 0;">0</h1>
            <button onclick="location.reload()">Jogar Novamente</button>
        </div>

        <div class="leaderboard-box">
            <h3>📊 Top 3 - Ao Vivo</h3>
            <ul id="leaderboard-list">
                <li style="justify-content: center;">Carregando...</li>
            </ul>
        </div>

    </div>
  </div>

  <script type="module">
    // Importa as funções do Firebase direto do Google
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- ⬇️ COLE SUA CONFIGURAÇÃO DO FIREBASE ABAIXO ⬇️ ---
    const firebaseConfig = {
  apiKey: "AIzaSyA2TdsWbqOhYUrezQ3zSG9OeP2ZSIxGpBk",
  authDomain: "quiz-d1e99.firebaseapp.com",
  projectId: "quiz-d1e99",
  storageBucket: "quiz-d1e99.firebasestorage.app",
  messagingSenderId: "685198946824",
  appId: "1:685198946824:web:e29547e188de650e39d7bd",
  measurementId: "G-RX5CN69ZMF"
};
    // --- ⬆️ FIM DA CONFIGURAÇÃO ⬆️ ---

    // Inicializa Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- Lógica do Jogo ---
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let username = "";
    let timerInterval;
    let timeLeft = 0;

    // Elementos do DOM (para usar dentro do module)
    const btnStart = document.getElementById('btn-start');
    const btnSubmitText = document.getElementById('btn-submit-text');

    // Carregar Perguntas
    async function loadQuestions() {
        try {
            const res = await fetch('perguntas/quiz_data.json');
            questions = await res.json();
        } catch(e) { alert("Erro ao carregar perguntas."); }
    }

    // Botão Iniciar
    btnStart.addEventListener('click', async () => {
        username = document.getElementById('username').value.trim();
        if(!username) return alert("Digite um nome!");
        
        await loadQuestions();
        if(questions.length === 0) return;

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        showQuestion();
    });

    // Função de Exibir Pergunta
    function showQuestion() {
        if(currentQuestionIndex >= questions.length) {
            endGame();
            return;
        }

        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.text;
        
        const optionsDiv = document.getElementById('options-container');
        const textInput = document.getElementById('text-answer');
        
        optionsDiv.innerHTML = "";
        textInput.value = "";
        
        clearInterval(timerInterval);
        timeLeft = q.time_limit;
        document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
            if(timeLeft <= 0) processAnswer(false);
        }, 1000);

        if(q.type === 'multiple_choice') {
            textInput.classList.add('hidden');
            btnSubmitText.classList.add('hidden');
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        } else {
            textInput.classList.remove('hidden');
            btnSubmitText.classList.remove('hidden');
            textInput.focus();
        }
    }

    // Botão de enviar texto
    btnSubmitText.addEventListener('click', () => {
        const val = document.getElementById('text-answer').value;
        if(val) checkAnswer(val);
    });

    function checkAnswer(userAnswer) {
        const q = questions[currentQuestionIndex];
        const isCorrect = userAnswer.toString().toLowerCase() === q.correct.toString().toLowerCase();
        processAnswer(isCorrect);
    }

    function processAnswer(isCorrect) {
        clearInterval(timerInterval);
        if (isCorrect) {
            score += 100 + (timeLeft * 10);
        }
        document.getElementById('score-display').innerText = `💎 ${score}`;
        currentQuestionIndex++;
        setTimeout(showQuestion, 500);
    }

    // Fim de Jogo: Salva no Firebase
    async function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;

        // SALVA NO BANCO DE DADOS
        try {
            await addDoc(collection(db, "ranking_humble"), {
                username: username,
                score: score,
                date: new Date() // Salva a data também
            });
        } catch (e) {
            console.error("Erro ao salvar:", e);
        }
    }

    // --- LEADERBOARD EM TEMPO REAL ---
    // Isso aqui fica "escutando" o banco. Se alguém jogar, atualiza sozinho na sua tela.
    const q = query(collection(db, "ranking_humble"), orderBy("score", "desc"), limit(3));
    
    onSnapshot(q, (snapshot) => {
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = ""; // Limpa a lista
        
        let index = 1;
        snapshot.forEach((doc) => {
            const data = doc.data();
            const li = document.createElement('li');
            let medal = index===1?"🥇":index===2?"🥈":index===3?"🥉":"";
            
            li.innerHTML = `<span>${medal} #${index} ${data.username}</span> <span>${data.score}</span>`;
            list.appendChild(li);
            index++;
        });

        if(index === 1) list.innerHTML = "<li>Sem pontuações ainda...</li>";
    });

  </script>
</body>
</html>
