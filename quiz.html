<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz Interativo - Humble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/mike_anotando2.png">
  
  <style>
    /* --- IMPORTANDO FONTE MAIS MODERNA (ROBOTO/POPPINS) --- */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    :root {
      --cor-dourado: #ffc107; /* Amarelo mais vivo igual da print */
      --cor-fundo: #121212; 
      --cor-card: #0a0a0a; /* Fundo do card quase preto */
      --cor-texto: #ffffff;
      --nav-height: 60px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif; /* Fonte mais bonita */
    }

    body {
      /* Fundo escuro com gradiente sutil para dar profundidade */
      background: radial-gradient(circle at center, #2a2a2a 0%, #0f0f0f 100%);
      color: var(--cor-texto);
      display: flex; 
      flex-direction: column; 
      min-height: 100vh;
    }

    /* --- NAVBAR ESTILO "SELECIONE SUA VERSÃO" --- */
    nav {
        background-color: #1a1a1a;
        border-bottom: 2px solid var(--cor-dourado); /* A linha amarela */
        height: var(--nav-height);
        display: flex;
        align-items: center;
        padding: 0 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .nav-logo {
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--cor-dourado); /* Texto Amarelo */
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* --- ÁREA PRINCIPAL --- */
    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
    }

    /* Imagem do macaco no canto (Opcional, igual na print 2) */
    .bg-mascot {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 300px; /* Ajuste conforme a imagem */
        opacity: 0.8;
        pointer-events: none;
        z-index: 0;
    }

    /* --- CARD DO QUIZ (ESTILO BOTÕES DO MENU) --- */
    .quiz-box {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 500px;
        background-color: var(--cor-card); /* Preto fosco */
        border-radius: 15px; /* Bordas arredondadas */
        padding: 40px;
        text-align: center;
        /* Sombra suave para destacar do fundo */
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        border: 1px solid #333; /* Borda sutil cinza escuro */
    }

    .quiz-header-logo {
        height: 50px;
        margin-bottom: 15px;
    }

    h2 {
        color: var(--cor-dourado);
        font-size: 1.5rem;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    p {
        color: #aaa;
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    /* --- INPUTS E BOTÕES --- */
    input { 
        padding: 12px; 
        width: 100%; 
        border-radius: 8px; 
        border: 1px solid #444; 
        background-color: #1a1a1a !important; 
        color: white !important; 
        margin-bottom: 20px; 
        text-align: center; 
        font-size: 1rem; 
        transition: 0.3s;
    }
    input:focus {
        border-color: var(--cor-dourado);
        outline: none;
    }

    button { 
        padding: 12px 30px; 
        width: 100%;
        background: var(--cor-dourado); 
        border: none; 
        font-weight: 700; 
        cursor: pointer; 
        border-radius: 8px; 
        text-transform: uppercase; 
        font-size: 0.9rem; 
        color: #000;
        transition: transform 0.2s, filter 0.2s;
    }
    button:hover { 
        filter: brightness(1.1);
        transform: translateY(-2px); 
    }
    
    .hidden { display: none !important; }

    /* Opções de Resposta */
    .option-btn { 
        background: transparent; 
        border: 1px solid #444; 
        color: #ccc; 
        margin: 8px 0; 
        transition: 0.2s;
    }
    .option-btn:hover { 
        border-color: var(--cor-dourado); 
        color: var(--cor-dourado); 
        background: rgba(255, 193, 7, 0.05);
    }

    /* --- LEADERBOARD DENTRO DO CARD --- */
    .leaderboard-box {
        margin-top: 30px; 
        text-align: left; 
        background: #111; 
        padding: 15px; 
        border-radius: 10px; 
        border: 1px solid #222;
    }
    .leaderboard-box h3 { 
        text-align: center; 
        color: #fff; 
        font-size: 1rem;
        margin-top: 0; 
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    ul { list-style: none; padding: 0; margin-top: 10px; }
    li { 
        padding: 8px; 
        border-bottom: 1px solid #222; 
        display: flex; 
        justify-content: space-between;
        font-size: 0.9rem;
    }
    li:last-child { border-bottom: none; }
    li:nth-child(1) { color: #ffd700; } 

    /* --- FOOTER DISCRETO --- */
    footer {
        background-color: transparent; /* Transparente para casar com o fundo */
        color: #555;
        text-align: center;
        padding: 20px;
        font-size: 0.75rem;
    }
    footer strong { color: #777; }

    /* Admin Panel */
    #admin-panel {
        margin-top: 20px; padding: 10px; border: 1px dashed #444;
        background: rgba(0,0,0,0.2); display: none;
    }
    .btn-admin { width: auto; padding: 8px 15px; margin: 2px; font-size: 0.8rem; color: white;}
    .btn-stop { background: #d32f2f; color: white; }
    
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">
       <img src="img/mike_anotando2.png" alt="" style="height: 30px;"> 
       Humble Quiz
    </div>
  </nav>

  <main>
    
    <div class="quiz-box">
        
        <div id="login-screen">
            <h2>Quem é você?</h2>
            <p>Digite seu nick para entrar na sala</p>
            
            <input type="text" id="username" placeholder="Seu Nick..." maxlength="15" autocomplete="off" />
            <button id="btn-enter">ENTRAR NA SALA</button>

            <div id="admin-panel">
                <h4 style="color:#d32f2f; margin-bottom:5px;">⚠️ Admin</h4>
                <input type="password" id="admin-pass" placeholder="Senha..." style="width: 80%;">
                <br>
                <button class="btn-admin" id="btn-admin-start" style="background: #2ecc71;">Iniciar</button>
                <button class="btn-admin btn-stop" id="btn-admin-stop">Parar</button>
                <button class="btn-admin" id="btn-admin-reset" style="background: #3498db;">Reset</button>
                <div style="margin-top:5px;">
                    <input type="text" id="ban-input" placeholder="Nick ban..." style="width: 60%; padding:5px;">
                    <button class="btn-admin" id="btn-admin-ban" style="background:#000;">Ban</button>
                </div>
            </div>

            <div class="leaderboard-box">
                <h3>📊 Top 3 - Ao Vivo</h3>
                <ul id="leaderboard-list">
                    <li style="justify-content: center; color: #555;">Nenhum jogador...</li>
                </ul>
            </div>
        </div>

        <div id="lobby-screen" class="hidden">
            <div style="font-size: 3rem;">⏳</div>
            <h2 style="margin-top:10px;">Aguardando...</h2>
            <p>O Mestre iniciará a partida em breve.</p>
            <p style="font-size: 0.8rem; border: 1px solid #333; display:inline-block; padding: 5px 15px; border-radius: 20px;">
                Logado como: <strong id="lobby-username" style="color: var(--cor-dourado)"></strong>
            </p>
        </div>

        <div id="game-screen" class="hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: var(--cor-dourado);">
                <span id="timer">⏳ 0s</span>
                <span id="score-display">💎 0</span>
            </div>
            
            <h2 id="question-text" style="color: #fff; font-size: 1.2rem; min-height: 50px;">Carregando...</h2>
            <div id="options-container"></div>
            
            <input type="text" id="text-answer" class="hidden" placeholder="Sua resposta...">
            <button id="btn-submit-text" class="hidden">Confirmar</button>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Fim de Jogo!</h2>
            <p id="end-message">Pontuação Final</p>
            <h1 id="final-score" style="color: var(--cor-dourado); font-size: 4rem; margin: 10px 0;">0</h1>
            <button onclick="location.reload()" style="background: #333; color: #fff;">Voltar ao Início</button>
        </div>

    </div>

    </main>

  <footer>
    <p>&copy; 2026 <strong>Humble Pixelmon</strong>. Todos os direitos reservados.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, setDoc, getDoc, onSnapshot, query, orderBy, limit, getDocs, writeBatch, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⬇️ RECOLOQUE SUAS CHAVES AQUI! ⬇️
    const firebaseConfig = {
      apiKey: "AIzaSyA2TdsWbqOhYUrezQ3zSG9OeP2ZSIxGpBk",
      authDomain: "quiz-d1e99.firebaseapp.com",
      projectId: "quiz-d1e99",
      storageBucket: "quiz-d1e99.firebasestorage.app",
      messagingSenderId: "685198946824",
      appId: "1:685198946824:web:e29547e188de650e39d7bd",
      measurementId: "G-RX5CN69ZMF"
    };
    // ⬆️ --------------------------- ⬆️

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- VARIÁVEIS ---
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let username = "";
    let userDocId = ""; 
    let timerInterval;
    let timeLeft = 0;
    let gameHasStarted = false;
    let isGameEnded = false;

    // Normaliza strings
    const normalize = (str) => str.toString().toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    const loginScreen = document.getElementById('login-screen');
    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');
    const usernameInput = document.getElementById('username');

    // ======================================================
    // 🛡️ BANLIST
    // ======================================================
    const termosProibidos = [
       "admin", "moderador", "staff", "suporte", "gm", "god",
        "baceta", "b4ceta", "b@ceta", "buceta",
        "puta", "puto", "pu.ta", "p.uta", "p4ta", "put4", "put@", "vagabunda", "vagaba", "rapariga", "piranha", "fdp",
        "merda", "m3rda", "bosta", "cagar", "cagado",
        "caralho", "krl", "carai", "caraio", "c4ralho", "pqp",
        "boceta", "buceta", "bct", "buc3ta", "b0ceta", "xereca", "xoxota", "ppk", "pepeca", "xrk", "xana"
        "viado", "v1ado", "viad0", "bixa", "bicha", "boiola", "baitola", "biba", "viadinho", "gayzista",
        "fuder", "foder", "fudido", "fudida", "fodido", "f0der", "fud3r", "foda", "foda-se",
        "pau", "pinto", "piroca", "pica", "rolan", "rola", "penis", "p1nto", "p1roca", "ereto", "gozo", "gozar", "gozada", "gozeidinha", "sperma", "porra", "p0rra", "gozadinha", "leitada", "leitei", 
        "cu", "c.u", "c*", "anus", "anal", "furico", "arrombado", "arrombada", "smt", "bago", 
        "boquete", "boqueteiro", "boqueteira", "chupa", "chupei", "mamada", "mamar",
        "sexo", "sex", "s3x", "transar", "trepar", "suruba", "orgia", "estupro", "abuso", "abusado", "molestado", "pedofilo", "pedofilia", "zoofilo", "zoofilia", "zoofililo", "zoophilo", "d.dirry", "diddy", "molestador",
        "jack", "estuprador", "abusador", "estudador" 
        "corno", "c0rno", "cornudo", "chifrudo", "chuca", "xuca", "x4ca", "ch4ca", "retardado", "autista", "prostituta",
        "preto", "negro", "neguim", "neguinho", "criolo", "crioulo", "macaco", "macaca", "m4caco", "m4caca", "escravo", "senzala", "2550c01",
        "hitler", "h1tler", "nazista", "nazi", "ritler", "suastica", "ariano", "favelado", "favelada", 
        "judeu", "judiaria", 
        "nigga", "nigger", 
        "traveco", "travesti", "tr4veco", "shemale", "femboy", "tomboy", "veveco"
        "fuck", "fck", "dick", "pussy", "asshole", "bitch", "shit", "cunt", "whore", "cock", "suck"
    ];

    function contemTermoProibido(nickOriginal) {
        if(!nickOriginal) return false;
        let nickLower = nickOriginal.toLowerCase();
        for (let termo of termosProibidos) {
            if (nickLower.includes(termo)) return true;
        }
        const mapaLeet = {'4': 'a', '@': 'a', '3': 'e', '1': 'i', '!': 'i', '0': 'o', '5': 's', '$': 's', '7': 't', '+': 't', 'v': 'u'};
        let nickLimpo = normalize(nickOriginal);
        nickLimpo = nickLimpo.split('').map(char => mapaLeet[char] || char).join('');
        let nickSemPontos = nickLimpo.replace(/[^a-z]/g, "");
        for (let termo of termosProibidos) {
            if (nickLimpo.includes(termo) || nickSemPontos.includes(termo)) return true;
        }
        return false; 
    }

    // CARREGAR
    async function loadQuestions() {
        try {
            const res = await fetch('perguntas/quiz_data.json');
            questions = await res.json();
        } catch(e) { console.error("Erro JSON", e); }
    }

    // ENTRAR
    document.getElementById('btn-enter').addEventListener('click', async () => {
        let rawName = usernameInput.value.trim();
        if(!rawName) return alert("Digite um nome!");
        
        if (contemTermoProibido(rawName)) {
            alert("⚠️ Nickname inválido.");
            usernameInput.value = ""; 
            return;
        }
        username = rawName; 
        
        await loadQuestions();
        if(questions.length === 0) return alert("Erro ao carregar perguntas.");

        try {
            // Check Blacklist
            const banDocRef = doc(db, "blacklist_humble", normalize(username));
            const banDoc = await getDoc(banDocRef);
            if(banDoc.exists()) { alert("⛔ Este nick foi banido."); return; }

            // Check Duplicidade
            const qCheck = query(collection(db, "ranking_humble"), where("username", "==", username));
            const snap = await getDocs(qCheck);
            if (!snap.empty) { alert("Nick já em uso."); return; }

            // Reserva
            const docRef = await addDoc(collection(db, "ranking_humble"), {
                username: username, score: 0, status: "lobby", date: new Date()
            });
            userDocId = docRef.id;

            loginScreen.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
            document.getElementById('lobby-username').innerText = username;
            
            listenGameState();

        } catch (e) { alert("Erro de conexão."); }
    });

    // LISTENER
    function listenGameState() {
        onSnapshot(doc(db, "config", "estado_jogo"), (docSnapshot) => {
            if (!docSnapshot.exists()) return;
            const state = docSnapshot.data();
            
            if (state.status === "ROLANDO" && !gameHasStarted && !isGameEnded) {
                gameHasStarted = true;
                startGame();
            }
            if (state.status === "ENCERRADO" && gameHasStarted && !isGameEnded) {
                alert("O Quiz foi encerrado!");
                forceEndGame();
            }
            if (state.status === "ESPERA" && gameHasStarted) {
                alert("O jogo foi reiniciado!");
                location.reload();
            }
        });
    }

    function startGame() {
        lobbyScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if(isGameEnded) return;
        if(currentQuestionIndex >= questions.length) { endGame(); return; }
        
        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.text;
        
        const optionsDiv = document.getElementById('options-container');
        const textInput = document.getElementById('text-answer');
        
        optionsDiv.innerHTML = "";
        textInput.value = "";
        
        clearInterval(timerInterval);
        timeLeft = q.time_limit;
        document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
            if(timeLeft <= 0) processAnswer(false);
        }, 1000);

        if(q.type === 'multiple_choice') {
            textInput.classList.add('hidden');
            document.getElementById('btn-submit-text').classList.add('hidden');
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        } else {
            textInput.classList.remove('hidden');
            document.getElementById('btn-submit-text').classList.remove('hidden');
            textInput.focus();
            textInput.onkeypress = (e) => { if(e.key === "Enter") checkAnswer(textInput.value); };
        }
    }
    
    document.getElementById('btn-submit-text').addEventListener('click', () => {
        checkAnswer(document.getElementById('text-answer').value);
    });

    function checkAnswer(userAnswer) {
        if(isGameEnded || !userAnswer) return;
        const q = questions[currentQuestionIndex];
        const isCorrect = normalize(userAnswer) === normalize(q.correct);
        processAnswer(isCorrect);
    }

    function processAnswer(isCorrect) {
        clearInterval(timerInterval);
        if (isCorrect) score += 100 + (timeLeft * 10);
        document.getElementById('score-display').innerText = `💎 ${score}`;
        currentQuestionIndex++;
        setTimeout(showQuestion, 500);
    }

    async function endGame() {
        if(isGameEnded) return;
        isGameEnded = true;
        gameScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        saveScore();
    }

    async function forceEndGame() {
        if(isGameEnded) return;
        isGameEnded = true;
        clearInterval(timerInterval);
        lobbyScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        saveScore();
    }

    async function saveScore() {
        if(!userDocId) return;
        try {
            await updateDoc(doc(db, "ranking_humble", userDocId), {
                score: score, status: "finalizado", date: new Date()
            });
        } catch (e) { try{await addDoc(collection(db, "ranking_humble"), { username: username, score: score, status: "recuperado", date: new Date() });}catch(e2){} }
    }

    // --- ADMIN ---
    usernameInput.addEventListener('input', (e) => {
        if(e.target.value.toLowerCase() === 'admin') document.getElementById('admin-panel').style.display = 'block';
    });

    document.getElementById('btn-admin-start').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha errada!");
        try { await setDoc(doc(db, "config", "estado_jogo"), { status: "ROLANDO" }); alert("Iniciado!"); } catch(e) { alert("Erro."); }
    });

    document.getElementById('btn-admin-stop').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha errada!");
        if(!confirm("Encerrar?")) return;
        try { await setDoc(doc(db, "config", "estado_jogo"), { status: "ENCERRADO" }); } catch(e) { alert("Erro."); }
    });

    document.getElementById('btn-admin-reset').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha errada!");
        if(!confirm("Resetar ranking?")) return;
        try {
            const q = query(collection(db, "ranking_humble"));
            const snapshot = await getDocs(q);
            const batch = writeBatch(db);
            snapshot.forEach((doc) => batch.delete(doc.ref));
            await batch.commit();
            await setDoc(doc(db, "config", "estado_jogo"), { status: "ESPERA" });
            location.reload();
        } catch(e) { alert("Erro: " + e.message); }
    });

    // BAN MANUAL
    document.getElementById('btn-admin-ban').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha admin!");
        const nickBan = document.getElementById('ban-input').value.trim();
        if(!nickBan) return;
        if(!confirm(`BANIR "${nickBan}"?`)) return;

        try {
            await setDoc(doc(db, "blacklist_humble", normalize(nickBan)), { originalName: nickBan, bannedAt: new Date() });
            const q = query(collection(db, "ranking_humble"), where("username", "==", nickBan));
            const snap = await getDocs(q);
            const batch = writeBatch(db);
            snap.forEach((doc) => batch.delete(doc.ref));
            await batch.commit();
            alert(`🚫 "${nickBan}" Banido.`);
            document.getElementById('ban-input').value = "";
        } catch(e) { alert("Erro ao banir."); }
    });

    // LEADERBOARD (Com desempate por data)
    const qRank = query(collection(db, "ranking_humble"), orderBy("score", "desc"), orderBy("date", "asc"), limit(3));
    onSnapshot(qRank, (snapshot) => {
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = "";
        if (snapshot.empty) { list.innerHTML = "<li style='justify-content:center; color: #555;'>Nenhum jogador registrado.</li>"; return; }
        let index = 1;
        snapshot.forEach((doc) => {
            const d = doc.data();
            const li = document.createElement('li');
            let medal = index===1?"🥇":index===2?"🥈":index===3?"🥉":"";
            li.innerHTML = `<span>${medal} #${index} ${d.username}</span> <span>${d.score}</span>`;
            list.appendChild(li);
            index++;
        });
    });
  </script>
</body>
</html>
