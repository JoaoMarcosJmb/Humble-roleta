<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz Interativo - Humble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/mike_anotando2.png">
  
  <style>
    /* --- ESTILOS VISUAIS (TEMA HUMBLE) --- */
    :root {
      --cor-dourado: #d1a720; 
      --cor-fundo: #1a1a1a; 
      --cor-texto: #f5f5f5;
      --cor-overlay: rgba(20, 20, 20, 0.95);
      --cor-erro: #e74c3c;
      --cor-aviso: #e67e22;
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0; padding: 0; min-height: 100vh;
      color: var(--cor-texto);
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; padding: 15px; background: var(--cor-overlay);
      border-bottom: 2px solid var(--cor-dourado); text-align: center;
      position: fixed; top: 0; z-index: 100;
    }
    header h1 a { color: var(--cor-dourado); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; }
    header img { height: 40px; }

    .main-content { margin-top: 100px; width: 95%; max-width: 600px; }
    .quiz-box {
        background: rgba(30, 30, 30, 0.95); border: 2px solid var(--cor-dourado);
        border-radius: 15px; padding: 25px; text-align: center;
        box-shadow: 0 0 15px rgba(209, 167, 32, 0.3);
    }

    .hidden { display: none !important; }

    input { padding: 12px; width: 70%; border-radius: 5px; border: 1px solid var(--cor-dourado); background: #222; color: white; margin-bottom: 10px; text-align: center; font-size: 1.1em; outline: none;}
    button { padding: 12px 25px; background: var(--cor-dourado); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; margin-top: 10px; font-size: 1rem; }
    button:hover { background: #e5bd35; transform: scale(1.05); }
    
    .option-btn { width: 100%; background: transparent; border: 1px solid var(--cor-dourado); color: var(--cor-dourado); margin: 8px 0; }
    .option-btn:hover { background: var(--cor-dourado); color: black; }

    .hud { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; }
    
    /* Painel Admin */
    #admin-panel {
        margin-top: 20px; padding: 15px; border: 1px dashed var(--cor-erro);
        background: rgba(50, 0, 0, 0.5); display: none;
    }
    .btn-admin { background: var(--cor-erro); color: white; font-size: 0.9rem; margin: 5px; }
    /* Botão Finalizar (Laranja) */
    .btn-stop { background: var(--cor-aviso); }

    /* Lobby */
    .loader { font-size: 2rem; animation: pulse 1.5s infinite; margin: 20px 0; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    /* Leaderboard */
    .leaderboard-box {
        margin-top: 30px; text-align: left; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px;
    }
    .leaderboard-box h3 { text-align: center; color: var(--cor-dourado); margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #444; display: flex; justify-content: space-between;}
    li:nth-child(1) { color: #ffd700; font-weight: bold; } 
    li:nth-child(2) { color: #c0c0c0; } 
    li:nth-child(3) { color: #cd7f32; }
  </style>
</head>
<body>

  <header>
    <h1>
      <a href="index.html">
        <img src="https://i.imgur.com/XOEcuO8.png" alt="Icone"> Humble Quiz
      </a>
    </h1>
  </header>

  <div class="main-content">
    <div class="quiz-box">
        
        <div id="login-screen">
            <h2>🏆 Humble Quiz</h2>
            <p>Digite seu nick para entrar na sala:</p>
            <input type="text" id="username" placeholder="Seu Nick..." maxlength="15" />
            <br>
            <button id="btn-enter">ENTRAR NA SALA</button>

            <div id="admin-panel">
                <h4>⚠️ Área do Admin</h4>
                <p style="font-size:0.8rem">Senha: humbleadmin</p>
                <input type="password" id="admin-pass" placeholder="Senha..." style="width: 50%;">
                <br>
                <button class="btn-admin" id="btn-admin-start" style="background: #27ae60;">▶️ INICIAR JOGO</button>
                <button class="btn-admin btn-stop" id="btn-admin-stop">⏹️ FINALIZAR JOGO</button>
                <br>
                <button class="btn-admin" id="btn-admin-reset">🔄 RESETAR TUDO</button>
            </div>
        </div>

        <div id="lobby-screen" class="hidden">
            <h2>⏳ Aguardando Início...</h2>
            <div class="loader">⚡</div>
            <p>O Mestre iniciará a partida em breve.</p>
            <p style="font-size: 0.9em; color: #aaa;">Logado como: <strong id="lobby-username" style="color: var(--cor-dourado)"></strong></p>
        </div>

        <div id="game-screen" class="hidden">
            <div class="hud">
                <span id="timer">⏳ 0s</span>
                <span id="score-display">💎 0</span>
            </div>
            
            <h2 id="question-text">Carregando...</h2>
            <div id="options-container"></div>
            <input type="text" id="text-answer" class="hidden" placeholder="Sua resposta...">
            <button id="btn-submit-text" class="hidden">Confirmar</button>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Fim de Jogo!</h2>
            <p id="end-message">Sua pontuação foi salva.</p>
            <h1 id="final-score" style="color: var(--cor-dourado); font-size: 4rem; margin: 10px 0;">0</h1>
            <button onclick="location.reload()">Sair / Novo Login</button>
        </div>

        <div class="leaderboard-box">
            <h3>📊 Top 3 - Ao Vivo</h3>
            <ul id="leaderboard-list">
                <li style="justify-content: center;">Carregando...</li>
            </ul>
        </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, orderBy, limit, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- ⬇️ SUAS CHAVES AQUI ⬇️ ---
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "NUMEROS",
      appId: "NUMEROS_LETRAS"
    };
    // --- ⬆️ FIM DAS CHAVES ⬆️ ---

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- VARIÁVEIS ---
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let username = "";
    let timerInterval;
    let timeLeft = 0;
    let gameHasStarted = false;
    let isGameEnded = false;

    // --- ELEMENTOS ---
    const loginScreen = document.getElementById('login-screen');
    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');
    const usernameInput = document.getElementById('username');

    // 1. CARREGAR PERGUNTAS
    async function loadQuestions() {
        try {
            const res = await fetch('perguntas/quiz_data.json');
            questions = await res.json();
        } catch(e) { console.error("Erro JSON", e); }
    }

    // 2. ENTRAR NO LOBBY
    document.getElementById('btn-enter').addEventListener('click', async () => {
        username = usernameInput.value.trim();
        if(!username) return alert("Digite um nome!");

        await loadQuestions();
        if(questions.length === 0) return alert("Erro ao carregar perguntas. Verifique o JSON.");

        loginScreen.classList.add('hidden');
        lobbyScreen.classList.remove('hidden');
        document.getElementById('lobby-username').innerText = username;

        listenGameState();
    });

    // 3. ESCUTAR ESTADO DO JOGO (WAITING / RUNNING / ENCERRADO)
    function listenGameState() {
        onSnapshot(doc(db, "config", "estado_jogo"), (doc) => {
            const state = doc.data();
            
            // INICIOU
            if (state && state.status === "ROLANDO" && !gameHasStarted && !isGameEnded) {
                gameHasStarted = true;
                startGame();
            }
            // FINALIZOU (Pelo Admin)
            if (state && state.status === "ENCERRADO" && gameHasStarted && !isGameEnded) {
                alert("O Mestre encerrou o Quiz!");
                forceEndGame();
            }
            // RESETOU
            if (state && state.status === "ESPERA" && gameHasStarted) {
                alert("O jogo foi reiniciado pelo Admin.");
                location.reload();
            }
        });
    }

    function startGame() {
        lobbyScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        showQuestion();
    }

    // 4. LÓGICA DO QUIZ
    function showQuestion() {
        if(isGameEnded) return;

        if(currentQuestionIndex >= questions.length) {
            endGame(); // Acabou normal
            return;
        }
        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.text;
        
        const optionsDiv = document.getElementById('options-container');
        const textInput = document.getElementById('text-answer');
        const btnSubmit = document.getElementById('btn-submit-text');
        
        optionsDiv.innerHTML = "";
        textInput.value = "";
        
        clearInterval(timerInterval);
        timeLeft = q.time_limit;
        document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
            if(timeLeft <= 0) processAnswer(false);
        }, 1000);

        if(q.type === 'multiple_choice') {
            textInput.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        } else {
            textInput.classList.remove('hidden');
            btnSubmit.classList.remove('hidden');
            textInput.focus();
            textInput.onkeypress = (e) => { if(e.key === "Enter") {
                 const val = textInput.value;
                 if(val) checkAnswer(val);
            }};
        }
    }
    
    document.getElementById('btn-submit-text').addEventListener('click', () => {
        const val = document.getElementById('text-answer').value;
        if(val) checkAnswer(val);
    });

    function checkAnswer(userAnswer) {
        if(isGameEnded) return;
        const q = questions[currentQuestionIndex];
        const isCorrect = userAnswer.toString().toLowerCase() === q.correct.toString().toLowerCase();
        processAnswer(isCorrect);
    }

    function processAnswer(isCorrect) {
        clearInterval(timerInterval);
        if (isCorrect) score += 100 + (timeLeft * 10);
        
        document.getElementById('score-display').innerText = `💎 ${score}`;
        currentQuestionIndex++;
        setTimeout(showQuestion, 500);
    }

    // Fim de Jogo NORMAL (Jogador acabou tudo)
    async function endGame() {
        if(isGameEnded) return;
        isGameEnded = true;

        gameScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;

        saveScore();
    }

    // Fim de Jogo FORÇADO (Admin clicou em Finalizar)
    async function forceEndGame() {
        if(isGameEnded) return;
        isGameEnded = true;
        clearInterval(timerInterval);

        lobbyScreen.classList.add('hidden'); // Caso esteja no lobby
        gameScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');
        
        document.getElementById('end-message').innerText = "O evento foi encerrado pelo Admin.";
        document.getElementById('final-score').innerText = score;

        saveScore();
    }

    async function saveScore() {
        // Só salva se tiver pontuação > 0 ou se jogou
        try {
            await addDoc(collection(db, "ranking_humble"), {
                username: username,
                score: score,
                date: new Date()
            });
        } catch (e) { console.error("Erro ao salvar pontos", e); }
    }

    // --- PAINEL DE ADMIN ---
    usernameInput.addEventListener('input', (e) => {
        if(e.target.value.toLowerCase() === 'admin') {
            document.getElementById('admin-panel').style.display = 'block';
        }
    });

    // 1. INICIAR
    document.getElementById('btn-admin-start').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha errada!");
        try {
            await updateDoc(doc(db, "config", "estado_jogo"), { status: "ROLANDO" });
            alert("Status: ROLANDO");
        } catch(e) { alert("Erro ao iniciar."); }
    });

    // 2. FINALIZAR (NOVO)
    document.getElementById('btn-admin-stop').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha errada!");
        if(!confirm("Encerrar o quiz para TODOS agora?")) return;

        try {
            await updateDoc(doc(db, "config", "estado_jogo"), { status: "ENCERRADO" });
            alert("Status: ENCERRADO");
        } catch(e) { alert("Erro ao finalizar."); }
    });

    // 3. RESETAR
    document.getElementById('btn-admin-reset').addEventListener('click', async () => {
        if(document.getElementById('admin-pass').value !== "humbleadmin") return alert("Senha errada!");
        if(!confirm("Apagar ranking e reiniciar?")) return;

        try {
            const q = query(collection(db, "ranking_humble"));
            const snapshot = await getDocs(q);
            const batch = writeBatch(db);
            snapshot.forEach((doc) => batch.delete(doc.ref));
            await batch.commit();

            await updateDoc(doc(db, "config", "estado_jogo"), { status: "ESPERA" });
            alert("Reset completo.");
            location.reload();
        } catch(e) { alert("Erro ao resetar."); }
    });

    // LEADERBOARD
    const qRank = query(collection(db, "ranking_humble"), orderBy("score", "desc"), limit(3));
    onSnapshot(qRank, (snapshot) => {
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = "";
        let index = 1;
        snapshot.forEach((doc) => {
            const d = doc.data();
            const li = document.createElement('li');
            let medal = index===1?"🥇":index===2?"🥈":index===3?"🥉":"";
            li.innerHTML = `<span>${medal} #${index} ${d.username}</span> <span>${d.score}</span>`;
            list.appendChild(li);
            index++;
        });
    });

  </script>
</body>
</html>
