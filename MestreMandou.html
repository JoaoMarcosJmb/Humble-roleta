<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mestre Mandou</title>

  <style>
    :root {
      --cor-dourado: #d1a720;
      --cor-texto: #f5f5f5;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center / cover fixed;
      color: var(--cor-texto);
      overflow-x: hidden;
    }

    /* ---------------- NAVBAR ---------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(20,20,20,0.9);
      border-bottom: 2px solid var(--cor-dourado);
      z-index: 1000;
    }

    header img {
      height: 42px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--cor-dourado);
      font-weight: 700;
    }

    /* ---------------- ÁREA PRINCIPAL ---------------- */
    .main-wrapper {
      margin-top: 120px;
      display: flex;
      justify-content: flex-start;
      flex-direction: column;
      align-items: center;
      padding-bottom: 180px; /* espaço para os botões fixos */
    }

    /* ---------------- CARD ---------------- */
    .card {
      background: rgba(0,0,0,0.60);
      border: 2px solid var(--cor-dourado);
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 18px rgba(209,167,32,0.35);
      animation: cardGlow 2.5s infinite ease-in-out;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 0 10px rgba(209,167,32,0.25); }
      50% { box-shadow: 0 0 20px rgba(209,167,32,0.45); }
      100% { box-shadow: 0 0 10px rgba(209,167,32,0.25); }
    }

    #categoria {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--cor-dourado);
    }

    /* imagem com flip 3D */
   #imagem {
  width: 320px;      /* largura fixa */
  height: 320px;     /* altura fixa */
  object-fit: contain; /* mantém proporção sem cortar */
  display: block;
  margin: 0 auto;

  border-radius: 14px;
  border: 3px solid var(--cor-dourado);

  background: rgba(0,0,0,0.4); /* fundo para imagens transparentes ficarem bonitas */

  opacity: 0;
  transform: rotateY(90deg);
  transition: opacity .4s ease, transform .5s ease;
}

    #imagem.mostrar {
      opacity: 1;
      transform: rotateY(0deg);
    }

    /* ---------------- BOTÕES FIXOS ---------------- */
    .botoes-fundo {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
      z-index: 900;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* shimmer bonito */
    button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: rgba(255,255,255,0.25);
      transform: skewX(-20deg);
      transition: .45s;
    }

    button:hover::after {
      left: 130%;
    }

    .verde { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .amarelo { background: linear-gradient(135deg, #f1c40f, #f39c12); color:#222; }
    .vermelho { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .roxo { background: linear-gradient(135deg, #8e44ad, #9b59b6); }

  </style>
</head>
<body>

  <!-- NAVBAR COM MASCOTE -->
  <header>
    <img src="img/mascote.png">  <!-- ⬅ Substitua pelo mascote clássico -->
    <h1>Mestre Mandou</h1>
  </header>

  <!-- CONTEÚDO -->
  <div class="main-wrapper">

    <div class="card">
      <div id="categoria">Selecione uma categoria</div>
      <img id="imagem" src="" alt="">
    </div>

  </div>

  <!-- BOTÕES FIXOS NO FUNDO -->
  <div class="botoes-fundo">
    <button class="verde" onclick="clicar('verde')">Verde (Fácil)</button>
    <button class="amarelo" onclick="clicar('amarelo')">Amarelo (Médio)</button>
    <button class="vermelho" onclick="clicar('vermelho')">Vermelho (Difícil)</button>
    <button class="roxo" onclick="clicar('roxo')">Roxo (Aleatório)</button>
  </div>

  <!-- SOM UI -->
  <audio id="somClique">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4d0521e8b5.mp3?filename=click-124467.mp3" type="audio/mpeg">
  </audio>

  <script>
    const som = document.getElementById("somClique");

    /* Se quiser manter o objeto 'nomes' para mapear nomes customizados mais tarde, deixei ele aqui */
    const nomes = {
      verde: {
      "img/verde/Alga.png": "Alga",
      "img/verde/Bamboo.png": "Bamboo",
      "img/verde/Bauxita.png": "Bauxita",
      "img/verde/Cacto.png": "Cacto",
      "img/verde/Cana_de_Açúcar.png": "Cana de Açúcar",
      "img/verde/Carvão.png": "Carvão",
      "img/verde/Cobre.png": "Cobre",
      "img/verde/Cogumelo.png": "Cogumelo",
      "img/verde/Cristal.png": "Cristal",
      "img/verde/Ferro.png": "Ferro",
      "img/verde/Folhas_de_Árvore.png": "Folhas de Árvore",
      "img/verde/Fóssil.png": "Fóssil",
      "img/verde/Graveto.png": "Graveto",
      "img/verde/Materiais_de_Ferro.png": "Materiais de Ferro",
      "img/verde/Materiais_de_Madeira.png": "Materiais de Madeira",
      "img/verde/Materiais_de_Pedra.png": "Materiais de Pedra",
      "img/verde/Muda_de_Árvore.png": "Muda de Árvore",
      "img/verde/Ouro.png": "Ouro",
      "img/verde/Suplementos.png": "Suplementos"
      },
      amarelo: {
      "img/amarelo/Ampulheta_Dourada.png": "Ampulheta Dourada",
      "img/amarelo/Ampulheta_Prateada.png": "Ampulheta Prateada",
      "img/amarelo/Diamante.png": "Diamante",
      "img/amarelo/Esmeralda.png": "Esmeralda",
      "img/amarelo/Foto_de_Pokémon_Aleatória.png": "Foto de Pokémon Aleatória",
      "img/amarelo/Materiais_de_Diamante.png": "Materiais de Diamante",
      "img/amarelo/Materiais_de_Netherita.png": "Materiais de Netherita",
      "img/amarelo/Mega_Pedra_Aletória.png": "Mega Pedra Aleatória",
      "img/amarelo/Netherita.png": "Netherita",
      "img/amarelo/Pão.png": "Pão",
      "img/amarelo/Pedra_da_Água.png": "Pedra de Água",
      "img/amarelo/Pedra_do_Fogo.png": "Pedra do Fogo",
      "img/amarelo/Pedra_do_Trovão.png": "Pedra do Trovão",
      "img/amarelo/Platina.png": "Platina",
      "img/amarelo/Z_Move_Aleatório.png": "Z Move Aleatório"
      },
      vermelho: {
      "img/vermelho/Carta_TCG.png": "Carta_TCG",
      "img/vermelho/Colméia.png": "Colméia",
      "img/vermelho/Núcleo_de_Zygarde.png": "Núcleo_de_Zygarde",
      "img/vermelho/Orb_das_Almas_Congeladas.png": "Orb_das_Almas_Congeladas",
      "img/vermelho/Orb_das_Almas_Estáticas.png": "Orb_das_Almas_Estáticas",
      "img/vermelho/Orb_das_Almas_Flamejantes.png": "Orb_das_Almas_Flamejantes",
      "img/vermelho/Silver_Bottlecap.png": "Silver_Bottlecap",
      "img/vermelho/Sino_da_Pureza.png": "Sino_da_Pureza",
      "img/vermelho/Sino_das_Marés.png": "Sino_das_Marés"
      }
    };

    /* Lista completa de imagens por categoria (corrigida: sem contagem numérica automática) */
    const imagens = {
      verde: [
        "img/verde/Alga.png",
        "img/verde/Bamboo.png",
        "img/verde/Bauxita.png",
        "img/verde/Cacto.png",
        "img/verde/Cana_de_Açúcar.png",
        "img/verde/Carvão.png",
        "img/verde/Cobre.png",
        "img/verde/Cogumelo.png",
        "img/verde/Cristal.png",
        "img/verde/Ferro.png",
        "img/verde/Folhas_de_Árvore.png",
        "img/verde/Fóssil.png",
        "img/verde/Graveto.png",
        "img/verde/Materiais_de_Ferro.png",
        "img/verde/Materiais_de_Madeira.png",
        "img/verde/Materiais_de_Pedra.png",
        "img/verde/Muda_de_Árvore.png",
        "img/verde/Ouro.png",
        "img/verde/Suplementos.png"
      ],
      amarelo: [
        "img/amarelo/Ampulheta_Dourada.png",
        "img/amarelo/Ampulheta_Prateada.png",
        "img/amarelo/Diamante.png",
        "img/amarelo/Esmeralda.png",
        "img/amarelo/Foto_de_Pokémon_Aleatória.png",
        "img/amarelo/Materiais_de_Diamante.png",
        "img/amarelo/Materiais_de_Netherita.png",
        "img/amarelo/Mega_Pedra_Aletória.png",
        "img/amarelo/Netherita.png",
        "img/amarelo/Pão.png",
        "img/amarelo/Pedra_de_Água.png",
        "img/amarelo/Pedra_do_Fogo.png",
        "img/amarelo/Pedra_do_Trovão.png",
        "img/amarelo/Platina.png",
        "img/amarelo/Z_Move_Aleatório.png"
      ],
      vermelho: [
        "img/vermelho/Carta_TCG.png",
        "img/vermelho/Colméia.png",
        "img/vermelho/Núcleo_de_Zygarde.png",
        "img/vermelho/Orb_das_Almas_Congeladas.png",
        "img/vermelho/Orb_das_Almas_Estáticas.png",
        "img/vermelho/Orb_das_Almas_Flamejantes.png",
        "img/vermelho/Silver_Bottlecap.png",
        "img/vermelho/Sino_da_Pureza.png",
        "img/vermelho/Sino_das_Marés.png"
      ]
    };

    const usadas = { verde: [], amarelo: [], vermelho: [] };

    function clicar(cor) {
      som.currentTime = 0;
      som.play();
      sortear(cor);
    }

    function sortear(cor) {
      let categoria = cor;

      if (cor === "roxo") {
        const list = ["verde", "amarelo", "vermelho"];
        categoria = list[Math.floor(Math.random() * 3)];
      }

      const lista = imagens[categoria];
      const restantes = lista.filter(x => !usadas[categoria].includes(x));

      if (!restantes.length) {
        alert("Todas imagens dessa categoria já foram usadas!");
        return;
      }

      const escolha = restantes[Math.floor(Math.random() * restantes.length)];
      usadas[categoria].push(escolha);

      const img = document.getElementById("imagem");
      img.classList.remove("mostrar");

      setTimeout(() => {
        img.src = escolha;
        img.classList.add("mostrar");
        img.style.borderColor = {
          verde:"#2ecc71",
          amarelo:"#f1c40f",
          vermelho:"#e74c3c",
          roxo:"#9b59b6"
        }[categoria];
      }, 120);

      // pega só o nome do arquivo sem pasta
      let nomeArquivo = escolha.split("/").pop().split(".")[0];

      // transforma underline "_" em espaço (opcional)
      nomeArquivo = nomeArquivo.replace(/_/g, " ");

      // coloca a primeira letra maiúscula (opcional)
      nomeArquivo = nomeArquivo.charAt(0).toUpperCase() + nomeArquivo.slice(1);

      document.getElementById("categoria").innerText = nomeArquivo;
    }
  </script>

</body>
</html>
