<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mestre Mandou</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/mike_anotando2.png">
  <link rel="shortcut icon" type="image/png" href="img/mike_anotando2.png">
  <link rel="apple-touch-icon" href="img/mike_anotando2.png">

  <style>
    :root {
      --cor-dourado: #d1a720;
      --cor-fundo: #1a1a1a;
      --cor-card: rgba(40, 35, 25, 0.95);
      --cor-texto: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      color: var(--cor-texto);
    }

    /* ---------------- NAVBAR DO OUTRO PROJETO ---------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20,20,20,0.9);
      border-bottom: 2px solid var(--cor-dourado);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      z-index: 1000;
    }

    header h1 {
      font-size: 1.8rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--cor-dourado);
    }

    header h1 img {
      height: 40px;
      cursor: pointer;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 34px;
      height: 22px;
      cursor: pointer;
    }
    .menu-toggle span {
      display: block;
      height: 4px;
      background: var(--cor-texto);
      border-radius: 4px;
      transition: 0.25s;
    }
    .menu-toggle.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }
    .menu-toggle.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    nav {
      position: absolute;
      top: 65px;
      right: 10px;
      background: rgba(30,25,20,0.95);
      border: 1px solid var(--cor-dourado);
      border-radius: 12px;
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    nav.active { display: flex; }

    nav a {
      color: var(--cor-dourado);
      text-decoration: none;
      font-size: 1rem;
      transition: 0.15s;
    }
    nav a:hover { color: var(--cor-texto); }

    /* ---------------- CARD CENTRAL ---------------- */
    .card {
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid var(--cor-dourado);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      max-width: 600px;
      width: 90%;
      margin: 150px auto 0 auto;
    }

    #categoria {
      margin-top: 5px;
      font-size: 1.5rem;
      color: var(--cor-dourado);
    }

    #imagem {
      display: block;
      margin: 25px auto 0 auto;
      max-width: 420px;
      border-radius: 14px;
      border: 3px solid var(--cor-dourado);
      opacity: 0;
      transition: opacity 0.4s ease, border-color 0.3s ease;
    }

    #imagem.mostrar { opacity: 1; }

    /* ---------------- BOTÕES FORA DO CARD ---------------- */
    .botoes {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
      padding-bottom: 60px;
    }

    button {
      border: none;
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 12px rgba(255,255,255,0.25);
    }

    .verde {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
    }
    .amarelo {
      background: linear-gradient(135deg, #f1c40f, #f39c12);
      color: #333;
    }
    .vermelho {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
    }
    .roxo {
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
    }
  </style>
</head>
<body>

  <!-- NAVBAR IDÊNTICA AO OUTRO PROJETO -->
  <header>
    <h1>
      <img src="https://i.imgur.com/XOEcuO8.png">
      Mestre Mandou
    </h1>

    <div class="menu-toggle" id="menuBtn">
      <span></span><span></span><span></span>
    </div>
  </header>

  <nav id="dropdownMenu">
    <a href="index.html">🏠 Início</a>
    <a href="https://www.humblepixelmon.com.br">🌐 Site Oficial</a>
    <a href="Quem_e_esse_pokemon.html">🗡️ Quem é esse pokemon</a>
    <a href="roleta.html">🛡️ Roleta</a>
  </nav>

  <!-- CARD CENTRAL -->
  <div class="card">
    <div id="categoria">Selecione uma categoria</div>
    <img id="imagem" src="" alt="">
  </div>

  <!-- BOTÕES FORA DO CARD -->
  <div class="botoes">
    <button class="verde" onclick="sortear('verde')">Verde (Fácil)</button>
    <button class="amarelo" onclick="sortear('amarelo')">Amarelo (Médio)</button>
    <button class="vermelho" onclick="sortear('vermelho')">Vermelho (Difícil)</button>
    <button class="roxo" onclick="sortear('roxo')">Roxo (Aleatório)</button>
  </div>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const dropdownMenu = document.getElementById("dropdownMenu");

    menuBtn.onclick = () => {
      menuBtn.classList.toggle("active");
      dropdownMenu.classList.toggle("active");
    };

    /* ---------- SISTEMA DE IMAGENS ---------- */
    const imagens = { verde: [], amarelo: [], vermelho: [] };
    const totalImagens = { verde: 10, amarelo: 10, vermelho: 10 };

    for (let cor in totalImagens) {
      for (let i = 1; i <= totalImagens[cor]; i++) {
        imagens[cor].push(`img/${cor}/${i}.png`);
      }
    }

    const usadas = { verde: [], amarelo: [], vermelho: [] };

    function sortear(cor) {
      let categoriaEscolhida = cor;

      if (cor === "roxo") {
        categoriaEscolhida = ["verde", "amarelo", "vermelho"][Math.floor(Math.random() * 3)];
      }

      const lista = imagens[categoriaEscolhida];
      const restantes = lista.filter(img => !usadas[categoriaEscolhida].includes(img));

      if (restantes.length === 0) {
        alert("Todas as imagens dessa categoria já foram usadas!");
        return;
      }

      const sorteada = restantes[Math.floor(Math.random() * restantes.length)];
      usadas[categoriaEscolhida].push(sorteada);

      const img = document.getElementById("imagem");
      const cat = document.getElementById("categoria");

      const cores = {
        verde: "#2ecc71",
        amarelo: "#f1c40f",
        vermelho: "#e74c3c",
        roxo: "#9b59b6"
      };

      img.classList.remove("mostrar");
      setTimeout(() => {
        img.src = sorteada;
        img.style.borderColor = cores[categoriaEscolhida];
        img.classList.add("mostrar");
      }, 80);

      cat.textContent = `Categoria: ${categoriaEscolhida}`;
      cat.style.color = cores[categoriaEscolhida];
    }
  </script>
</body>
</html>
