<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mestre Mandou</title>
  <link rel="icon" type="image/png" href="img/mike_anotando2.png">

  <style>
    :root {
      --dourado: #d1a720;
      --fundo: #1a1a1a;
      --texto: #f5f5f5;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      color: var(--texto);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 20, 20, 0.9);
      border-bottom: 2px solid var(--dourado);
      padding: 15px;
      font-size: 1.6rem;
      color: var(--dourado);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      text-align: center;
    }

    /* ---------- Conteúdo Central ---------- */
    .conteudo {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .botoes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 14px 26px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    .verde { background-color: #2ecc71; }
    .amarelo { background-color: #f1c40f; color: #333; }
    .vermelho { background-color: #e74c3c; }
    .roxo { background-color: #9b59b6; }

    #categoria {
      margin-top: 10px;
      font-size: 1.5rem;
      color: var(--dourado);
      transition: color 0.3s;
    }

    #imagem {
      display: block;
      margin: 25px auto 0 auto;
      max-width: 480px;
      max-height: 480px;
      border-radius: 12px;
      border: 3px solid var(--dourado);
      opacity: 0;
      transition: opacity 0.4s ease, border-color 0.3s ease;
    }

    #imagem.mostrar {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .botoes {
        flex-direction: column;
        align-items: center;
      }

      #imagem {
        width: 85%;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <header>Mestre Mandou</header>

  <main class="conteudo">
    <div class="botoes">
      <button class="verde" onclick="sortear('verde')">Verde (Fácil)</button>
      <button class="amarelo" onclick="sortear('amarelo')">Amarelo (Médio)</button>
      <button class="vermelho" onclick="sortear('vermelho')">Vermelho (Difícil)</button>
      <button class="roxo" onclick="sortear('roxo')">Roxo (Aleatório)</button>
    </div>

    <div id="categoria"></div>
    <img id="imagem" src="" alt="Imagem sorteada">
  </main>

  <script>
    const imagens = {
      verde: [],
      amarelo: [],
      vermelho: [],
    };

    // Ajuste aqui a quantidade real de imagens em cada pasta
    const totalImagens = {
      verde: 1,
      amarelo: 1,
      vermelho: 1,
    };

    // Carrega os caminhos das imagens
    for (let cor in totalImagens) {
      for (let i = 1; i <= totalImagens[cor]; i++) {
        imagens[cor].push(`img/${cor}/${i}.png`);
      }
    }

    const usadas = { verde: [], amarelo: [], vermelho: [] };

    function sortear(cor) {
      let categoriaEscolhida = cor;

      if (cor === "roxo") {
        const cores = ["verde", "amarelo", "vermelho"];
        categoriaEscolhida = cores[Math.floor(Math.random() * cores.length)];
      }

      const lista = imagens[categoriaEscolhida];
      const restantes = lista.filter(img => !usadas[categoriaEscolhida].includes(img));

      if (restantes.length === 0) {
        alert("Todas as imagens dessa categoria já foram exibidas! Dê F5 para reiniciar.");
        return;
      }

      const sorteada = restantes[Math.floor(Math.random() * restantes.length)];
      usadas[categoriaEscolhida].push(sorteada);

      const imagem = document.getElementById("imagem");
      const categoria = document.getElementById("categoria");

      const cores = {
        verde: "#2ecc71",
        amarelo: "#f1c40f",
        vermelho: "#e74c3c",
        roxo: "#9b59b6"
      };

      // Efeito fade-in suave
      imagem.classList.remove("mostrar");
      setTimeout(() => {
        imagem.src = sorteada;
        imagem.style.borderColor = cores[categoriaEscolhida];
        imagem.classList.add("mostrar");
      }, 50);

      categoria.textContent = `Categoria: ${categoriaEscolhida.charAt(0).toUpperCase() + categoriaEscolhida.slice(1)}`;
      categoria.style.color = cores[categoriaEscolhida];
    }
  </script>
</body>
</html>
