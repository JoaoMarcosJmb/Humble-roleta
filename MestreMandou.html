<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mestre Mandou</title>

  <style>
    :root {
      --cor-dourado: #d1a720;
      --cor-texto: #f5f5f5;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center / cover fixed;
      color: var(--cor-texto);
      overflow-x: hidden;
    }

    /* ---------------- NAVBAR ---------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(20,20,20,0.9);
      border-bottom: 2px solid var(--cor-dourado);
      z-index: 1000;
    }

    header img {
      height: 42px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--cor-dourado);
      font-weight: 700;
    }

    /* ---------------- ÁREA PRINCIPAL ---------------- */
    .main-wrapper {
      margin-top: 120px;
      display: flex;
      justify-content: flex-start;
      flex-direction: column;
      align-items: center;
      padding-bottom: 180px; /* espaço para os botões fixos */
    }

    /* ---------------- CARD ---------------- */
    .card {
      background: rgba(0,0,0,0.60);
      border: 2px solid var(--cor-dourado);
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 18px rgba(209,167,32,0.35);
      animation: cardGlow 2.5s infinite ease-in-out;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 0 10px rgba(209,167,32,0.25); }
      50% { box-shadow: 0 0 20px rgba(209,167,32,0.45); }
      100% { box-shadow: 0 0 10px rgba(209,167,32,0.25); }
    }

    #categoria {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--cor-dourado);
    }

    /* imagem com flip 3D */
    #imagem {
      max-width: 380px;
      border-radius: 14px;
      border: 3px solid var(--cor-dourado);
      opacity: 0;
      transform: rotateY(90deg);
      transition: opacity .4s ease, transform .5s ease;
    }

    #imagem.mostrar {
      opacity: 1;
      transform: rotateY(0deg);
    }

    /* ---------------- BOTÕES FIXOS ---------------- */
    .botoes-fundo {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
      z-index: 900;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* shimmer bonito */
    button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: rgba(255,255,255,0.25);
      transform: skewX(-20deg);
      transition: .45s;
    }

    button:hover::after {
      left: 130%;
    }

    .verde { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .amarelo { background: linear-gradient(135deg, #f1c40f, #f39c12); color:#222; }
    .vermelho { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .roxo { background: linear-gradient(135deg, #8e44ad, #9b59b6); }

  </style>
</head>
<body>

  <!-- NAVBAR COM MASCOTE -->
  <header>
    <img src="img/mascote.png">  <!-- ⬅ Substitua pelo mascote clássico -->
    <h1>Mestre Mandou</h1>
  </header>

  <!-- CONTEÚDO -->
  <div class="main-wrapper">

    <div class="card">
      <div id="categoria">Selecione uma categoria</div>
      <img id="imagem" src="" alt="">
    </div>

  </div>

  <!-- BOTÕES FIXOS NO FUNDO -->
  <div class="botoes-fundo">
    <button class="verde" onclick="clicar('verde')">Verde (Fácil)</button>
    <button class="amarelo" onclick="clicar('amarelo')">Amarelo (Médio)</button>
    <button class="vermelho" onclick="clicar('vermelho')">Vermelho (Difícil)</button>
    <button class="roxo" onclick="clicar('roxo')">Roxo (Aleatório)</button>
  </div>

  <!-- SOM UI -->
  <audio id="somClique">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4d0521e8b5.mp3?filename=click-124467.mp3" type="audio/mpeg">
  </audio>

  <script>
    const som = document.getElementById("somClique");

    const imagens = {
      verde: [],
      amarelo: [],
      vermelho: []
    };

    const totalImagens = { verde: 10, amarelo: 10, vermelho: 10 };

    for (let c in totalImagens) {
      for (let i = 1; i <= totalImagens[c]; i++) {
        imagens[c].push(`img/${c}/${i}.png`);
      }
    }
const nomes = {
  verde: {
    "img/verde/1.png": "NOME DO ITEM 1",
    "img/verde/2.png": "NOME DO ITEM 2",
    "img/verde/3.png": "NOME DO ITEM 3"
  },
  amarelo: {
    "img/amarelo/1.png": "NOME DO ITEM 1",
    "img/amarelo/2.png": "NOME DO ITEM 2",
    "img/amarelo/3.png": "NOME DO ITEM 3"
  },
  vermelho: {
    "img/vermelho/Sino_das_Marés.png": "Sino das Marés",
    "img/vermelho/Sino_da_Pureza.png": "Sino da Pureza",
    "img/vermelho/Silver_Bottlecap.png": "Silver Bottlecap",
    "img/vermelho/Orb_das_Almas_Flamejantes.png": "Orb das Almas Flamejantes",
    "img/vermelho/Orb_das_Almas_Estáticas.png": "Orb das Almas Estáticas",
    "img/vermelho/Orb_das_Almas_Congeladas.png": "Orb das Almas Congeladas",
    "img/vermelho/Núcle_de_Zygarde.png": "Núcleo de Zygarde",
    "img/vermelho/Colméia.png": "Colméia",
    "img/vermelho/Carta_TCG.webp": "Carta_TCG"
  }
};
    const usadas = { verde: [], amarelo: [], vermelho: [] };

    function clicar(cor) {
      som.currentTime = 0;
      som.play();
      sortear(cor);
    }

    function sortear(cor) {
      let categoria = cor;

      if (cor === "roxo") {
        const list = ["verde", "amarelo", "vermelho"];
        categoria = list[Math.floor(Math.random() * 3)];
      }

      const lista = imagens[categoria];
      const restantes = lista.filter(x => !usadas[categoria].includes(x));

      if (!restantes.length) {
        alert("Todas imagens dessa categoria já foram usadas!");
        return;
      }

      const escolha = restantes[Math.floor(Math.random() * restantes.length)];
      usadas[categoria].push(escolha);

      const img = document.getElementById("imagem");
      img.classList.remove("mostrar");

      setTimeout(() => {
        img.src = escolha;
        img.classList.add("mostrar");
        img.style.borderColor = {
          verde:"#2ecc71",
          amarelo:"#f1c40f",
          vermelho:"#e74c3c",
          roxo:"#9b59b6"
        }[categoria];
      }, 120);

      // pega só o nome do arquivo sem pasta
let nomeArquivo = escolha.split("/").pop().split(".")[0];

// transforma underline "_" em espaço (opcional)
nomeArquivo = nomeArquivo.replace(/_/g, " ");

// coloca a primeira letra maiúscula (opcional)
nomeArquivo = nomeArquivo.charAt(0).toUpperCase() + nomeArquivo.slice(1);

document.getElementById("categoria").innerText = nomeArquivo;

    }
  </script>

</body>
</html>
