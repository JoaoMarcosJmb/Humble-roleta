<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mestre Mandou</title>
  <link rel="icon" type="image/png" href="img/mike_anotando2.png">

  <style>
    :root {
      --dourado: #d1a720;
      --texto: #f5f5f5;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      color: var(--texto);
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: rgba(20, 20, 20, 0.9);
      border-bottom: 2px solid var(--dourado);
      padding: 15px;
      font-size: 1.6rem;
      color: var(--dourado);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      text-align: center;
    }

    /* ---------- Container Central ---------- */
    .conteudo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 20px;
      border: 2px solid var(--dourado);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      width: 90%;
      max-width: 700px;
    }

    /* ---------- Botões ---------- */
    .botoes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 12px rgba(255,255,255,0.25);
    }

    .verde {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      box-shadow: 0 0 10px rgba(46,204,113,0.6);
    }

    .amarelo {
      background: linear-gradient(135deg, #f1c40f, #f39c12);
      color: #333;
      box-shadow: 0 0 10px rgba(243,156,18,0.6);
    }

    .vermelho {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      box-shadow: 0 0 10px rgba(231,76,60,0.6);
    }

    .roxo {
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      box-shadow: 0 0 10px rgba(155,89,182,0.6);
    }

    /* ---------- Categoria + Imagem ---------- */
    #categoria {
      margin-top: 5px;
      font-size: 1.5rem;
      color: var(--dourado);
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
      transition: color 0.3s;
    }

    #imagem {
      display: block;
      margin-top: 25px;
      max-width: 400px;
      max-height: 400px;
      border-radius: 14px;
      border: 3px solid var(--dourado);
      opacity: 0;
      transition: opacity 0.4s ease, border-color 0.3s ease;
    }

    #imagem.mostrar {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .conteudo {
        padding: 25px;
      }

      button {
        width: 100%;
      }

      #imagem {
        max-width: 80%;
      }
    }
  </style>
</head>
<body>
  <header>Mestre Mandou</header>

  <main class="conteudo">
    <div class="botoes">
      <button class="verde" onclick="sortear('verde')">Verde (Fácil)</button>
      <button class="amarelo" onclick="sortear('amarelo')">Amarelo (Médio)</button>
      <button class="vermelho" onclick="sortear('vermelho')">Vermelho (Difícil)</button>
      <button class="roxo" onclick="sortear('roxo')">Roxo (Aleatório)</button>
    </div>

    <div id="categoria">Selecione uma categoria</div>
    <img id="imagem" src="" alt="Imagem sorteada">
  </main>

  <script>
    const imagens = {
      verde: [],
      amarelo: [],
      vermelho: [],
    };

    // Quantidade de imagens em cada pasta
    const totalImagens = {
      verde: 10,
      amarelo: 10,
      vermelho: 10,
    };

    // Carrega os caminhos das imagens
    for (let cor in totalImagens) {
      for (let i = 1; i <= totalImagens[cor]; i++) {
        imagens[cor].push(`img/${cor}/${i}.png`);
      }
    }

    const usadas = { verde: [], amarelo: [], vermelho: [] };

    function sortear(cor) {
      let categoriaEscolhida = cor;

      if (cor === "roxo") {
        const cores = ["verde", "amarelo", "vermelho"];
        categoriaEscolhida = cores[Math.floor(Math.random() * cores.length)];
      }

      const lista = imagens[categoriaEscolhida];
      const restantes = lista.filter(img => !usadas[categoriaEscolhida].includes(img));

      if (restantes.length === 0) {
        alert("Todas as imagens dessa categoria já foram exibidas! Dê F5 para reiniciar.");
        return;
      }

      const sorteada = restantes[Math.floor(Math.random() * restantes.length)];
      usadas[categoriaEscolhida].push(sorteada);

      const imagem = document.getElementById("imagem");
      const categoria = document.getElementById("categoria");

      const cores = {
        verde: "#2ecc71",
        amarelo: "#f1c40f",
        vermelho: "#e74c3c",
        roxo: "#9b59b6"
      };

      // Transição suave
      imagem.classList.remove("mostrar");
      setTimeout(() => {
        imagem.src = sorteada;
        imagem.style.borderColor = cores[categoriaEscolhida];
        imagem.classList.add("mostrar");
      }, 80);

      categoria.textContent = `Categoria: ${categoriaEscolhida.charAt(0).toUpperCase() + categoriaEscolhida.slice(1)}`;
      categoria.style.color = cores[categoriaEscolhida];
    }
  </script>
</body>
</html>
