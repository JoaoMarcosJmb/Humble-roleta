<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mestre Mandou</title>

  <style>
    :root {
      --cor-dourado: #d1a720;
      --cor-texto: #f5f5f5;
      --cor-card: rgba(40, 35, 25, 0.95);
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,30,20,0.85)),
                  url("https://i.imgur.com/vATNRmF.png") no-repeat center center fixed;
      background-size: cover;
      color: var(--cor-texto);
    }

    /* NAVBAR */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 15px 20px;
      background: rgba(20,20,20,0.9);
      border-bottom: 2px solid var(--cor-dourado);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    header h1 {
      color: var(--cor-dourado);
      margin: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-wrapper {
      margin-top: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: calc(100vh - 120px);
    }

    /* CARD */
    .card {
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid var(--cor-dourado);
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 15px rgba(209,167,32,0.3);
      animation: glowCard 2.5s infinite ease-in-out;
    }

    @keyframes glowCard {
      0% { box-shadow: 0 0 10px rgba(209,167,32,0.25); }
      50% { box-shadow: 0 0 20px rgba(209,167,32,0.45); }
      100% { box-shadow: 0 0 10px rgba(209,167,32,0.25); }
    }

    #categoria {
      font-size: 1.5rem;
      color: var(--cor-dourado);
      margin-bottom: 10px;
    }

    /* IMAGEM COM ANIMAÇÃO FLIP 3D */
    #imagem {
      max-width: 420px;
      border-radius: 14px;
      border: 3px solid var(--cor-dourado);
      opacity: 0;
      transform: rotateY(90deg);
      transition: opacity .4s ease, transform .5s ease;
      margin-top: 10px;
    }

    #imagem.mostrar {
      opacity: 1;
      transform: rotateY(0deg);
    }

    /* BOTÕES */
    .botoes {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* Efeito shimmer */
    button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 80%;
      height: 100%;
      background: rgba(255,255,255,0.25);
      transform: skewX(-20deg);
      transition: 0.4s;
    }

    button:hover::after {
      left: 120%;
    }

    .verde { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .amarelo { background: linear-gradient(135deg, #f1c40f, #f39c12); color:#222; }
    .vermelho { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .roxo { background: linear-gradient(135deg, #8e44ad, #9b59b6); }

  </style>
</head>
<body>

  <!-- NAV -->
  <header>
    <h1>Mestre Mandou</h1>
  </header>

  <!-- CONTEÚDO -->
  <div class="main-wrapper">

    <div class="card">
      <div id="categoria">Selecione uma categoria</div>
      <img id="imagem" src="" alt="">
    </div>

    <div class="botoes">
      <button class="verde" onclick="clicar('verde')">Verde (Fácil)</button>
      <button class="amarelo" onclick="clicar('amarelo')">Amarelo (Médio)</button>
      <button class="vermelho" onclick="clicar('vermelho')">Vermelho (Difícil)</button>
      <button class="roxo" onclick="clicar('roxo')">Roxo (Aleatório)</button>
    </div>
  </div>

  <!-- SOM DE CLIQUE LEVE -->
  <audio id="somClique">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4d0521e8b5.mp3?filename=click-124467.mp3" type="audio/mpeg">
  </audio>

  <script>
    const som = document.getElementById("somClique");

    const imagens = {
      verde: [],
      amarelo: [],
      vermelho: []
    };

    const totalImagens = { verde: 10, amarelo: 10, vermelho: 10 };

    for (let c in totalImagens) {
      for (let i = 1; i <= totalImagens[c]; i++) {
        imagens[c].push(`img/${c}/${i}.png`);
      }
    }

    const usadas = { verde: [], amarelo: [], vermelho: [] };

    function clicar(cor) {
      som.currentTime = 0;
      som.play();
      sortear(cor);
    }

    function sortear(cor) {
      let categoria = cor;

      if (cor === "roxo") {
        const list = ["verde", "amarelo", "vermelho"];
        categoria = list[Math.floor(Math.random() * 3)];
      }

      const lista = imagens[categoria];
      const restantes = lista.filter(x => !usadas[categoria].includes(x));

      if (!restantes.length) {
        alert("Todas imagens dessa categoria já foram usadas!");
        return;
      }

      const escolha = restantes[Math.floor(Math.random() * restantes.length)];
      usadas[categoria].push(escolha);

      const img = document.getElementById("imagem");
      img.classList.remove("mostrar");

      setTimeout(() => {
        img.src = escolha;
        img.classList.add("mostrar");
        img.style.borderColor = {
          verde:"#2ecc71",
          amarelo:"#f1c40f",
          vermelho:"#e74c3c",
          roxo:"#9b59b6"
        }[categoria];
      }, 150);

      document.getElementById("categoria").innerText = `Categoria: ${categoria}`;
    }
  </script>

</body>
</html>
